  <line x1="320" y1="190" x2="520" y2="190" stroke="#e0e0f0" stroke-width="1"/>
  <text x="335" y="206" font-size="10" fill="#1a1a2e" font-weight="600">setting</text><text x="430" y="206" font-size="10" fill="#555">indoor/outdoor</text>
