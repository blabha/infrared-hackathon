  <line x1="28" y1="212" x2="228" y2="212" stroke="#e0e0f0" stroke-width="1"/>
  <text x="43" y="228" font-size="10" fill="#1a1a2e" font-weight="600">calendar_connected</text><text x="140" y="228" font-size="10" fill="#555">bool</text>

