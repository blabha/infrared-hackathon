  <text x="335" y="118" font-size="10" fill="#888">PK</text><text x="360" y="118" font-size="10" fill="#1a1a2e">idx</text><text x="430" y="118" font-size="10" fill="#555">integer</text>
  <line x1="320" y1="124" x2="520" y2="124" stroke="#e0e0f0" stroke-width="1"/>
