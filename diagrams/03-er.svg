<svg width="860" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="560" fill="#f8f9fb" rx="12"/>
  <text x="28" y="30" font-size="11" fill="#9b9bb4" font-weight="600" letter-spacing="1">DIAGRAM 3 — ENTITY RELATIONSHIP</text>
  <text x="28" y="56" font-size="22" fill="#1a1a2e" font-weight="700">What <tspan fill="#6b6bff">data</tspan>, and how is it <tspan fill="#6b6bff">related</tspan>?</text>

  <defs>
    <marker id="arc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aaa"/>
    </marker>
  </defs>

  <!-- ── EVENT table ── -->
